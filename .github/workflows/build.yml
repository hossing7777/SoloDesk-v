name: Build APK

on:
  push:
    branches: [main, cafe-bazaar]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Fetch fonts
        run: bash scripts/fetch_fonts.sh

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test || true

      - name: Decode keystore
        env:
          P1: ${{ secrets.KEYSTORE_PART1 }}
          P2: ${{ secrets.KEYSTORE_PART2 }}
          P3: ${{ secrets.KEYSTORE_PART3 }}
        run: |
          P1=$(printf '%s' "$P1" | tr -d '\n\r')
          P2=$(printf '%s' "$P2" | tr -d '\n\r')
          P3=$(printf '%s' "$P3" | tr -d '\n\r')
          echo "Lengths: ${#P1} ${#P2} ${#P3}"
          printf '%s%s%s' "$P1" "$P2" "$P3" | base64 -d > $RUNNER_TEMP/release.jks
          ls -la $RUNNER_TEMP/release.jks

      - name: Build APK (signed)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: solodesk-apk-signed
          path: build/app/outputs/flutter-apk/app-release.apk
