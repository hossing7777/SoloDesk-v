name: solodesk
description: Offline-first client and invoice manager for freelancers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.19.0
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_riverpod: ^2.5.1
  fl_chart: ^0.68.0
  pdf: ^3.11.0
  printing: ^5.12.0
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  csv: ^6.0.0
  url_launcher: ^6.3.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  local_auth: ^2.2.0
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.png
    - assets/icon/icon.png
    - assets/invoice_templates/
    - assets/fonts/Vazirmatn/Vazirmatn-Regular.ttf
    - assets/fonts/Vazirmatn/Vazirmatn-Bold.ttf
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn/Vazirmatn-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#111827"
  image: assets/logo.png
  android: true
  ios: false
  web: false
